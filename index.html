<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jackometer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@300;400;500;600;700&family=Material+Icons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
      :root {
        --primary: #111111;
        --accent: #007aff;
        --accent-deep: #005bb5;
        --accent-light: #4da6ff;
        --bg-color: #f2f2f7;
        --surface-color: rgba(255, 255, 255, 0.6);
        --panel-bg: rgba(255, 255, 255, 0.7);
        --text-primary: #1d1d1f;
        --text-secondary: #86868b;
        --border-color: rgba(0, 0, 0, 0.1);
        --card-bg: rgba(255, 255, 255, 0.6);
        --button-primary: #007aff;
        --button-primary-dark: #005bb5;
        --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        --glass-border: 1px solid rgba(255, 255, 255, 0.4);
        --btn-shadow: 0 6px 0 var(--button-primary-dark), 0 10px 18px rgba(0,0,0,0.18);
        --emerald-glow: inset 0 0 0 1px rgba(255,255,255,0.5);
      }

      [data-theme='dark'] {
        --primary: #f5f5f7;
        --accent: #0a84ff;
        --accent-deep: #0066cc;
        --accent-light: #5e9bff;
        --bg-color: #000000;
        --surface-color: rgba(28, 28, 30, 0.6);
        --panel-bg: rgba(44, 44, 46, 0.7);
        --text-primary: #f5f5f7;
        --text-secondary: #a1a1a6;
        --border-color: rgba(255, 255, 255, 0.1);
        --card-bg: rgba(28, 28, 30, 0.6);
        --button-primary: #0a84ff;
        --button-primary-dark: #0066cc;
        --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        --btn-shadow: 0 6px 0 var(--button-primary-dark), 0 10px 18px rgba(0,0,0,0.35);
        --emerald-glow: inset 0 0 0 1px rgba(255,255,255,0.05);
      }

      body {
        font-family: 'Architects Daughter', cursive, sans-serif;
        background-color: var(--bg-color);
        background-image: 
          radial-gradient(circle at top left, rgba(0, 122, 255, 0.1) 0%, transparent 40%),
          radial-gradient(circle at bottom right, rgba(94, 155, 255, 0.1) 0%, transparent 50%);
        background-attachment: fixed;
        color: var(--text-primary);
        font-weight: 400;
        transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s;
        overflow: hidden;
      }

      #root {
        height: 100vh;
        width: 100vw;
        position: relative;
        z-index: 1;
        overflow: hidden;
      }

      /* Typography */
      h1, h2, h3, .font-serif, .font-sans, .font-mono {
        font-family: 'Architects Daughter', cursive, sans-serif !important; 
        letter-spacing: 0.02em;
      }
      
      /* Glass Panel - The Core UI Element */
      .paper-panel, .glass-panel, .sketch-card, .sketch-card-soft, .sticky-card {
        background: var(--surface-color);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: var(--glass-border);
        box-shadow: var(--shadow-glass), var(--emerald-glow);
        border-radius: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        z-index: 10;
        overflow: hidden;
      }
      .paper-panel:hover, .glass-panel:hover, .sketch-card:hover, .sketch-card-soft:hover, .sticky-card:hover {
        box-shadow: var(--shadow-glass), 0 0 20px rgba(0, 122, 255, 0.15);
        border-color: rgba(0, 122, 255, 0.3);
      }
      
      /* 3D Hyper Realistic Buttons */
      .btn-primary, .btn-3d {
        background: linear-gradient(135deg, var(--button-primary), var(--accent-light));
        color: white;
        border-radius: 12px;
        padding: 12px 28px;
        font-weight: 700;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 0 var(--button-primary-dark), 0 8px 16px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.4);
        border: none;
        letter-spacing: 0.02em;
        font-size: 1rem;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn-primary:hover, .btn-3d:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 var(--button-primary-dark), 0 12px 20px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.5);
      }
      .btn-primary:active, .btn-3d:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 var(--button-primary-dark), 0 4px 8px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.2);
      }

      .btn-outline-sketch {
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.1);
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .btn-outline-sketch:hover {
        background: rgba(0, 122, 255, 0.05);
        border-color: rgba(0, 122, 255, 0.3);
      }
      
      /* Inputs Modernization */
      input, select, textarea {
        border-radius: 12px; 
        border: 1px solid var(--border-color);
        padding: 14px;
        background: var(--panel-bg);
        backdrop-filter: blur(8px);
        color: var(--text-primary);
        transition: all 0.2s;
        font-family: 'Architects Daughter', cursive, sans-serif;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2), inset 0 2px 4px rgba(0,0,0,0.02);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary); 
      }
    </style>
