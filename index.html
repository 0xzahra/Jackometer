<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jackometer</title>
    <script>
      // Set light theme before first paint to prevent dark flash
      document.documentElement.setAttribute('data-theme', 'light');
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600&family=Material+Icons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
      :root {
        --primary: #2c1810;
        --accent: #8b6914;
        --accent-deep: #6b4f0f;
        --accent-light: #c9a84c;
        --bg-color: #fdf8f0;
        --surface-color: rgba(255, 252, 245, 0.85);
        --panel-bg: rgba(255, 250, 240, 0.92);
        --text-primary: #1a0f08;
        --text-secondary: #7a6a58;
        --border-color: rgba(139, 105, 20, 0.2);
        --card-bg: rgba(255, 252, 245, 0.9);
        --button-primary: #6b4f0f;
        --button-primary-dark: #4a3508;
        --button-primary-light: #c9a84c;
        --shadow-glass: 0 8px 32px 0 rgba(139, 105, 20, 0.12);
        --glass-border: 1px solid rgba(201, 168, 76, 0.25);
        --btn-shadow: 0 5px 0 var(--button-primary-dark), 0 8px 16px rgba(74,53,8,0.2);
      }

      [data-theme='dark'] {
        --primary: #f0e8d8;
        --accent: #c9a84c;
        --accent-deep: #8b6914;
        --accent-light: #e8cc88;
        --bg-color: #000000;
        --surface-color: rgba(12, 12, 12, 0.98);
        --panel-bg: rgba(16, 16, 16, 0.99);
        --text-primary: #f0e8d8;
        --text-secondary: #7a7060;
        --border-color: rgba(240, 232, 216, 0.08);
        --card-bg: #0d0d0d;
        --button-primary: #c9a84c;
        --button-primary-dark: #8b6914;
        --button-primary-light: #e8cc88;
        --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        --glass-border: 1px solid rgba(201, 168, 76, 0.12);
        --btn-shadow: 0 5px 0 #8b6914, 0 8px 16px rgba(0,0,0,0.5);
      }

      body {
        font-family: 'IM Fell English', 'Times New Roman', Georgia, serif;
        background-color: var(--bg-color);
        background-image: 
          radial-gradient(circle at top left, rgba(139, 105, 20, 0.08) 0%, transparent 40%),
          radial-gradient(circle at bottom right, rgba(139, 105, 20, 0.04) 0%, transparent 50%);
        background-attachment: fixed;
        color: var(--text-primary);
        font-weight: 400;
        transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        width: 100vw;
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
      }

      /* Typography */
      h1, h2, h3, h4, .font-serif {
        font-family: 'IM Fell English', 'Times New Roman', Georgia, serif !important;
        letter-spacing: 0.01em;
      }
      
      /* Keep Inter for UI labels, buttons, small text */
      button, input, select, textarea, .font-sans, .text-xs, .text-sm, label, nav {
        font-family: 'Inter', system-ui, sans-serif !important;
      }
      
      /* Material Icons Explicit Override */
      .material-icons {
        font-family: 'Material Icons' !important;
        font-style: normal !important;
        font-weight: normal !important;
        font-size: 20px;
        line-height: 1;
        display: inline-block;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
      }
      
      /* Glass Panel - The Core UI Element */
      .paper-panel, .glass-panel, .sketch-card, .sketch-card-soft, .sticky-card {
        background: var(--surface-color);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: var(--glass-border);
        box-shadow: var(--shadow-glass);
        border-radius: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        z-index: 10;
        overflow: hidden;
      }
      .paper-panel:hover, .glass-panel:hover, .sketch-card:hover, .sketch-card-soft:hover, .sticky-card:hover {
        box-shadow: var(--shadow-glass), 0 0 20px rgba(139, 105, 20, 0.3);
        border-color: rgba(139, 105, 20, 0.5);
      }
      
      /* 3D Hyper Realistic Buttons */
      .btn-primary, .btn-3d {
        background: linear-gradient(160deg, var(--button-primary-light) 0%, var(--button-primary) 60%);
        color: #fff8ec;
        border-radius: 10px;
        padding: 11px 26px;
        font-weight: 700;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0.03em;
        font-size: 0.875rem;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: var(--btn-shadow), inset 0 1px 1px rgba(255,255,255,0.3);
        border: 1.5px solid var(--button-primary-dark);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-primary:hover, .btn-3d:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 0 var(--button-primary-dark), 0 14px 22px rgba(74,53,8,0.25), inset 0 1px 1px rgba(255,255,255,0.4);
      }
      .btn-primary:active, .btn-3d:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--button-primary-dark), 0 2px 6px rgba(74,53,8,0.2);
      }

      .btn-outline-sketch {
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.1);
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .btn-outline-sketch:hover {
        background: rgba(139, 105, 20, 0.05);
        border-color: rgba(139, 105, 20, 0.3);
      }
      
      /* Inputs Modernization */
      input, select, textarea {
        border-radius: 12px; 
        border: 1px solid var(--border-color);
        padding: 14px;
        background: var(--panel-bg);
        backdrop-filter: blur(8px);
        color: var(--text-primary);
        transition: all 0.2s;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 0 3px rgba(139, 105, 20, 0.2), inset 0 2px 4px rgba(0,0,0,0.02);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary); 
      }
    </style>

</head>

</html>
